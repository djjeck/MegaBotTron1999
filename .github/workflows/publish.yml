# Publishes MegaBotTron1999's image to the GitHub Container Registry, as
# ghcr.io/djjeck/megabottron1999, for linux/amd64 and linux/arm64:
# - every push to main: the tag `edge`;
# - every pushed tag `v<version>`: the tag `<version>` (without the `v`), and `latest` unless the
#   version is a pre-release (`v0.1.0-alpha.1`: a hyphen after the patch), which `latest` never
#   follows, so that whoever runs `latest` only gets releases. Since `v0.1.0` there are no
#   pre-releases: each release bumps the patch (`v0.1.1`, `v0.1.2`, …).
# The checks of ci.yml run first, on the same commit.
name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run ci

  image:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up QEMU, for arm64
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/djjeck/megabottron1999
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
